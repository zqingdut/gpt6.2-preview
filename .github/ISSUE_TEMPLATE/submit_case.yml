name: 📥 提交 GPT-6.2 灰度案例
description: 粘贴一条 X/Twitter 推文链接（GPT-6.2 Astra / Sol 灰度目击或社区实测），机器人会自动解析并收录到 README 与 data/cases.json
title: "[case] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢贡献！只需粘贴推文链接，提交后 GitHub Actions 会自动抓取推文、生成预览动图、分类并更新索引（约 1 分钟）。
  - type: input
    id: tweet_url
    attributes:
      label: 推文链接
      description: X/Twitter 帖子链接，例如 https://x.com/author/status/1234567890
      placeholder: "https://x.com/…/status/…"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（可选）
      description: 原始 Prompt、耗时/成本等推文中没有的信息可写在这里
      placeholder: "Prompt: …"
    validations:
      required: false
