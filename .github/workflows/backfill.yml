name: Backfill LLM Classification

# Manual repair tool: re-runs LLM classification for cases that were
# ingested as degraded fallback records (e.g. while LLM_MODEL was wrong).
# Only degraded records are touched; if the LLM call fails, records are
# left unchanged. Trigger from the Actions tab after fixing the LLM
# secrets (LLM_API_KEY / LLM_BASE_URL / LLM_MODEL).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-llm
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Backfill Degraded Cases
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/backfill_llm.py --all --rebuild-readme

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cases.json README.md README_EN.md
          git diff --staged --quiet || git commit -m "fix(case): backfill LLM classification for degraded cases"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "push 冲突，10 秒后重试 ($i/5)"; sleep 10
          done
          [ "$ok" = "1" ] || { echo "推送失败"; exit 1; }
